version: '3.9'

services:
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: always
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host
    volumes:
      - ../../Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../ssl:/etc/caddy/ssl:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data: {}
  caddy-config: {}
